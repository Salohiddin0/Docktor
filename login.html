<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mico</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #fff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 360px;
        }

        h2 {
            text-align: center;
            color: #00c8b3;
        }

        input[type="email"],
        input[type="password"],
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #009e94;
        }

        button {
            background-color: #00c8b3;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #009e94;
        }


        .link {
            text-align: center;
            margin-top: 10px;
        }

        .link a {
            color: #00c8b3;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Login to MICO</h2>
        <form>
            <input type="email" placeholder="Email" required />
            <input type="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
        <div class="link">
            Don't have an account? <a href="signup.html">Sign Up</a>
            <a style="color: black; text-decoration:underline; margin-left: 10px" href="index.html">Back</a>
        </div>
    </div>
</body>

<script>
    document.querySelector("form").addEventListener("submit", async function (e) {
        e.preventDefault() // Sahifani qayta yuklamash uchun

        const email = document.querySelector("input[type='email']").value;
        const password = document.querySelector("input[type='password']").value;

        try {
            const response = await fetch("http://165.22.247.233:5001/api/Admins/Login/" + email, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });
            if (response.ok) {
                const data = await response.json();
                alert("Login muvaffaqiyatli! 👏\nToken: " + data.token);
                // localStorage.setItem("token", data.token); // Agar tokenni saqlamoqchi bo‘lsangiz
            } else {
                alert("Login xato! Parol yoki email notug'ri.");
            }
        } catch (error) {
            alert("Xatolik yuz berdi: " + error);
        }
    })
</script>

</html>
